name: Publish to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
           python-version: '3.14'

      - name: Install gdal
        run: |
          sudo apt-get --quiet update
          sudo apt-get install --yes gdal-bin libgdal-dev
          sudo apt-get install --yes pandoc

      - name: Installing Python packages
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          # Install NumPy before GDAL
          python3 -m pip install numpy
          # Install GDAL
          export CPLUS_INCLUDE_PATH=/usr/include/gdal
          export C_INCLUDE_PATH=/usr/include/gdal
          python3 -m pip install --no-build-isolation gdal==$(gdal-config --version)     
          # Install requirements
          python3 -m pip install -r requirements.txt
          python3 -m pip install sphinx nbsphinx sphinxcontrib-bibtex ipython
          python3 -m pip install .

      - name: Build tiles from GeoTIFF 
        run: |
          tif_file="docsrc/notebooks/newcal_loss_gain/out_tmf_10yr/fcc_tmf_epsg3857.tif"        
          vrt_file="$RUNNER_TEMP/fcc_tmf_rgba.vrt"
          png_odir="docsrc/notebooks/newcal_loss_gain/map/tiles_fcc"
          gdal_translate -of VRT -expand rgba "$tif_file" "$vrt_file"
          gdal2tiles.py --xyz -p mercator -z 5-12 -r near --processes=4 -w none $vrt_file $png_odir   

      - name: Include Mapbox secret token
        run: |
          html_file="docsrc/notebooks/newcal_loss_gain/map/fcc_tmf_interactive.html"
          sed -i "s/MAPBOX_PUBLIC_TOKEN/${{ secrets.MAPBOX_PUBLIC_TOKEN }}/g" $html_file

      - name: Building documentation
        run: sphinx-build docsrc docs/html -b html -d docs/doctree

      - name: Adding nojekyll file
        run: touch docs/html/.nojekyll

      - name: Deploy generated content to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/html
